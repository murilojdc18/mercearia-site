# Publica o site no GitHub Pages a cada push na main.
# Não há passo manual: editar, commitar e empurrar já coloca no ar.
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para o Pages aceitar a publicação
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que está no meio
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 24

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
